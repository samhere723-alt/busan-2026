<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0B5D7A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>釜山生日遊 · 口袋行程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
<style>
:root{
  /* 冷調紙（微藍偏移，避開暖奶油）+ 廣安暮色海藍 */
  --bg:#F1F4F6; --card:#FFFFFF; --card2:#E8EDF1;
  --ink:#10171C; --ink2:#3E4A55; --ink3:#5E6A75;
  --line:#DCE3E8; --line2:#EAEFF2;
  --sea:#0A5A78; --seaSoft:#DDEDF4; --seaOn:#FFFFFF;
  --signal:#B23F17; --signalSoft:#FBE7DE;
  --gold:#8A6209; --goldSoft:#F6EEDA;
  --go:#17694A; --goSoft:#DFEFE7; --goOn:#FFFFFF;
  --duskA:#FBEADB; --ig:#A03D6B; --igSoft:#FAE7F0;
  --shadow:0 1px 2px rgba(16,23,28,.05),0 6px 18px rgba(16,23,28,.06);
  --r:14px;
  --fs:"IBM Plex Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,sans-serif;
  --fm:"IBM Plex Mono","SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1417; --card:#172026; --card2:#1F2A31;
    --ink:#EDF2F5; --ink2:#A6B5BF; --ink3:#8695A0;
    --line:#27343C; --line2:#1E2930;
    --sea:#67C3E7; --seaSoft:#0D2E3B; --seaOn:#062430;
    --signal:#F0855F; --signalSoft:#361A11;
    --gold:#D6AE5C; --goldSoft:#2F2611;
    --go:#63C89B; --goSoft:#122B20; --goOn:#08251A;
    --duskA:#2A2030; --ig:#F2A0C4; --igSoft:#391B29;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.32);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1417; --card:#172026; --card2:#1F2A31;
  --ink:#EDF2F5; --ink2:#A6B5BF; --ink3:#8695A0;
  --line:#27343C; --line2:#1E2930;
  --sea:#67C3E7; --seaSoft:#0D2E3B; --seaOn:#062430;
  --signal:#F0855F; --signalSoft:#361A11;
  --gold:#D6AE5C; --goldSoft:#2F2611;
  --go:#63C89B; --goSoft:#122B20; --goOn:#08251A;
  --duskA:#2A2030; --ig:#F2A0C4; --igSoft:#391B29;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.32);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--fs);
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:40; background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 14px 0;
  border-bottom:1px solid var(--line);
}
.brand{display:flex;flex-direction:column;gap:1px;padding-bottom:9px}
.brow{display:flex;align-items:center;gap:10px}
.brand h1{font-size:17px;margin:0;letter-spacing:-.1px;font-weight:600;white-space:nowrap}
.brand .sub{font-size:11.5px;white-space:nowrap;color:var(--ink3);font-family:var(--fm);font-variant-numeric:tabular-nums}
.daybar{display:flex;gap:5px;padding-bottom:10px;overflow-x:auto;scrollbar-width:none}
.daybar::-webkit-scrollbar{display:none}
.daybtn{
  flex:0 0 auto;padding:9px 11px;min-height:40px;display:flex;align-items:center;border-radius:99px;background:var(--card2);
  font-size:12.5px;font-weight:600;color:var(--ink2);border:1px solid transparent;white-space:nowrap;letter-spacing:-.2px
}
.daybtn.on{background:var(--sea);color:var(--seaOn);border-color:var(--sea)}

main{padding:14px 14px 20px;max-width:640px;margin:0 auto}
.hide{display:none!important}

/* ---------- generic ---------- */
.dtitle{font-size:19px;font-weight:600;line-height:1.4;margin:20px 0 6px;text-wrap:balance;letter-spacing:-.2px}
.sun{margin:0 0 16px;font-size:12.5px;color:var(--ink2)}
.sec{margin:26px 0 11px;display:flex;align-items:baseline;gap:10px}
.sec h2{font-size:13.5px;margin:0;letter-spacing:.3px;color:var(--ink);font-weight:600;white-space:nowrap}
.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.note{font-size:13px;color:var(--ink2);line-height:1.65}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums;letter-spacing:-.2px}

.banner{
  background:var(--goldSoft);border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);
  border-radius:var(--r);padding:12px 14px;font-size:13.5px;line-height:1.65;margin-bottom:16px
}
.banner b{color:var(--gold)}
.banner.sea{background:var(--seaSoft);border-color:color-mix(in srgb,var(--sea) 28%,transparent)}
.banner.sea b{color:var(--sea)}

/* ---------- timeline ---------- */
.tl{position:relative;padding-left:20px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:24px;width:2px;background:var(--line)}
.ev{position:relative;margin-bottom:12px}
.ev:before{
  content:"";position:absolute;left:-19px;top:16px;width:10px;height:10px;border-radius:50%;
  background:var(--bg);border:2px solid var(--line)
}
.ev.key:before{border-color:var(--signal);background:var(--signal)}
.ev.now:before{border-color:var(--sea);background:var(--sea);box-shadow:0 0 0 4px color-mix(in srgb,var(--sea) 22%,transparent)}

.move{
  display:flex;align-items:center;gap:7px;margin:0 0 12px -2px;
  font-size:12.5px;color:var(--ink3);padding-left:2px
}
.move .pill{background:var(--card2);border-radius:99px;padding:3px 9px;border:1px solid var(--line2)}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden
}
.chead{display:flex;gap:11px;padding:12px 13px;align-items:flex-start;width:100%;text-align:left}
.time{
  flex:0 0 48px;font-size:13.5px;font-weight:600;color:var(--sea);
  font-family:var(--fm);font-variant-numeric:tabular-nums;padding-top:2px;letter-spacing:-.4px
}
.cbody{flex:1;min-width:0}
.ctitle{font-size:16px;font-weight:600;line-height:1.4;display:inline;text-wrap:balance}
.ctitle .conf{margin-left:6px;display:inline-block;vertical-align:2px}
.kr{font-size:13px;color:var(--ink2);margin-top:2px;word-break:keep-all}
.meta{font-size:12px;color:var(--ink3);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.chev{flex:0 0 16px;color:var(--ink3);font-size:12px;padding-top:5px;transition:transform .18s}
.card.open .chev{transform:rotate(90deg)}

.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;letter-spacing:.2px}
.t-food{background:var(--signalSoft);color:var(--signal)}
.t-shop{background:var(--seaSoft);color:var(--sea)}
.t-view{background:var(--goSoft);color:var(--go)}
.t-must{background:var(--goldSoft);color:var(--gold)}
.t-warn{background:var(--signalSoft);color:var(--signal)}

.cdet{display:none;padding:0 13px 13px;border-top:1px solid var(--line2)}
.card.open .cdet{display:block}
.cdet .row{margin-top:11px;font-size:13.5px;line-height:1.62}
.cdet .lbl{font-size:11px;font-weight:700;letter-spacing:.7px;color:var(--ink3);display:block;margin-bottom:3px}
.cdet ul{margin:3px 0 0;padding-left:17px}
.cdet li{margin:2px 0}
.warn{background:var(--signalSoft);border-radius:9px;padding:9px 11px;font-size:13px;color:var(--ink);line-height:1.6;margin-top:11px;border-left:3px solid var(--signal)}
.tip{background:var(--seaSoft);border-radius:9px;padding:9px 11px;font-size:13px;line-height:1.6;margin-top:11px;border-left:3px solid var(--sea)}

.acts{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.btn{
  flex:1 1 auto;min-width:96px;display:flex;align-items:center;justify-content:center;gap:5px;
  padding:11px 12px;border-radius:10px;font-size:13.5px;font-weight:650;
  background:var(--card2);border:1px solid var(--line);min-height:44px
}
.btn.pri{background:var(--sea);color:var(--seaOn);border-color:var(--sea)}
.btn.book{background:var(--goldSoft);color:var(--gold);border-color:color-mix(in srgb,var(--gold) 42%,transparent);font-weight:700}
.btn.ig{background:var(--igSoft);color:var(--ig);border-color:color-mix(in srgb,var(--ig) 40%,transparent);font-weight:700}
.btn:active{transform:scale(.985)}

/* checkbox */
/* 按鈕本體 44x46（拇指熱區），視覺方塊是內層 26x26 */
.chk{
  flex:0 0 44px;width:44px;height:46px;background:none;border:0;padding:0;
  display:flex;align-items:center;justify-content:center
}
.chk i{
  width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;color:transparent
}
.chk.on i{background:var(--go);border-color:var(--go);color:var(--goOn)}
.done .ctitle,.done .kr{opacity:.42;text-decoration:line-through}

/* ---------- lists (food / shop / map) ---------- */
.item{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow)
}
.ihead{display:flex;gap:10px;align-items:flex-start}
.iname{font-size:15.5px;font-weight:600;line-height:1.4;text-wrap:balance}
.day-badge{
  font-size:10.5px;font-weight:800;letter-spacing:.4px;padding:2px 7px;border-radius:5px;
  background:var(--card2);color:var(--ink2);border:1px solid var(--line);flex:0 0 auto;margin-top:2px
}
.conf{font-size:11px;padding:2px 7px;border-radius:5px;font-weight:650}
.c-ok{background:var(--goSoft);color:var(--go)}
.c-search{background:var(--seaSoft);color:var(--sea)}
.c-check{background:var(--signalSoft);color:var(--signal)}

/* must-eat tracker */
.musts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.must{
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;
  display:flex;align-items:center;gap:9px;box-shadow:var(--shadow);text-align:left
}
.must.on{background:var(--goSoft);border-color:color-mix(in srgb,var(--go) 40%,transparent)}
.must .e{font-size:20px;line-height:1;flex:0 0 auto}
.must .n{font-size:13.5px;font-weight:700;line-height:1.3;display:block}
.must .w{font-size:11px;color:var(--ink3);margin-top:2px;display:block;line-height:1.35}

/* korean phrases */
.ph{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 13px;margin-bottom:8px;box-shadow:var(--shadow);width:100%;text-align:left;display:block
}
.ph .zh{font-size:13px;color:var(--ink2)}
.ph .ko{font-size:18px;font-weight:700;margin:3px 0 2px;line-height:1.4;word-break:keep-all}
.ph .ro{font-size:11.5px;color:var(--ink3);letter-spacing:.2px}
.ph .sp{float:right;font-size:19px;padding:2px 4px;margin:-2px -2px 0 6px}

/* prep checklist */
.prep{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.prow{display:flex;gap:11px;padding:12px 13px;border-bottom:1px solid var(--line2);align-items:flex-start;width:100%;text-align:left}
.prow:last-child{border-bottom:0}
.prow .pt{flex:1;font-size:14px;line-height:1.5}
.prow .ps{font-size:12px;color:var(--ink3);margin-top:2px;line-height:1.5}
.prow.on .pt{opacity:.45;text-decoration:line-through}

/* ---------- bottom nav ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(6,1fr)
}
.nb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 1px;border-radius:11px;color:var(--ink3);min-height:46px;justify-content:center}
.nb .i{font-size:19px;line-height:1;font-weight:700}
.nb .l{font-size:10px;font-weight:650;letter-spacing:0}
.nb.on{color:var(--sea)}
.nb.on .l{font-weight:800}

.toast{
  position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:.22s;z-index:99;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.25)
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- IG 探索 ---------- */
.igbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 14px 12px;margin:0 -14px}
.igbar::-webkit-scrollbar{display:none}
.igchip{flex:0 0 auto;padding:8px 13px;min-height:38px;display:flex;align-items:center;gap:5px;border-radius:99px;
  background:var(--card2);border:1px solid transparent;font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.igchip.on{background:var(--sea);color:var(--seaOn);border-color:var(--sea)}
.iggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:0 -14px}
.igcell{position:relative;aspect-ratio:1;overflow:hidden;background:var(--card2);display:block;padding:0;border:0}
.igcell img{width:100%;height:100%;object-fit:cover;display:block}
.igcell .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 5px 4px;
  background:linear-gradient(to top,rgba(0,0,0,.8),rgba(0,0,0,.3) 60%,transparent);
  color:#fff;font-size:9.5px;font-weight:600;line-height:1.28;text-align:left;text-shadow:0 1px 3px rgba(0,0,0,.85);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.igcell .dbadge{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.66);color:#fff;
  font-family:var(--fm);font-size:9.5px;font-weight:600;padding:2px 6px;border-radius:5px}
.igcell .far{position:absolute;top:5px;right:5px;font-size:12px}
.igcell:active{opacity:.75}
.sheet{position:fixed;inset:0;z-index:80;display:none}
.sheet.on{display:block}
.sheet .scrim{position:absolute;inset:0;background:rgba(8,14,18,.62);backdrop-filter:blur(3px)}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;
  background:var(--card);border-radius:20px 20px 0 0;padding:0 0 calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 40px rgba(0,0,0,.32);animation:up .26s cubic-bezier(.2,.8,.25,1)}
@keyframes up{from{transform:translateY(26px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:9px auto 0}
.sheet .hero{width:100%;aspect-ratio:1;object-fit:cover;display:block;margin-top:10px}
.sheet .in{padding:14px}
.sheet h3{font-size:19px;margin:0 0 6px;line-height:1.35;text-wrap:balance;font-weight:600}
.sheet .body{font-size:14px;line-height:1.7;color:var(--ink)}
.sheet .x{position:absolute;top:14px;right:12px;width:34px;height:34px;border-radius:50%;
  background:rgba(0,0,0,.5);color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;z-index:2}
/* ---------- 慶祝層 ---------- */
.daycount{margin-left:auto;font-family:var(--fm);font-size:11px;font-weight:600;
  color:var(--gold);background:var(--goldSoft);padding:3px 9px;border-radius:99px;white-space:nowrap}
.eyebrow{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.8px;
  color:var(--gold);background:var(--goldSoft);padding:3px 9px;border-radius:6px;margin:0 0 7px}
.card.star{border-color:color-mix(in srgb,var(--gold) 48%,transparent);
  background:linear-gradient(168deg,var(--goldSoft) 0%,var(--card) 46%)}
.ev.star:before{border-color:var(--gold);background:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 20%,transparent)}
.card.dusk{background:linear-gradient(168deg,var(--duskA) 0%,var(--card) 52%)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:95;display:none}
.trophy{margin-top:10px;padding:12px 13px;border-radius:12px;background:var(--goldSoft);
  border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);font-size:13.5px;line-height:1.6}
.how{margin:4px 0 0;padding-left:19px}
.how li{margin:3px 0}

:focus-visible{outline:2.5px solid var(--sea);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
footer{text-align:center;font-size:11.5px;color:var(--ink3);padding:26px 14px 8px;line-height:1.7}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brow"><h1>🎂 釜山生日遊</h1><span class="daycount" id="dcount"></span></div>
    <span class="sub" id="hsub">09.12 02:40 → 09.14 22:00</span>
  </div>
  <div class="daybar" id="daybar"></div>
</header>

<main>
  <section id="v-plan"></section>
  <section id="v-food" class="hide"></section>
  <section id="v-shop" class="hide"></section>
  <section id="v-map"  class="hide"></section>
  <section id="v-ig"   class="hide"></section>
  <section id="v-ko"   class="hide"></section>
  <footer id="foot"></footer>
</main>

<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="IG 貼文詳情">
  <div class="scrim" data-close></div>
  <div class="panel" id="sheetPanel"></div>
</div>

<script>
/* =========================================================
   釜山生日遊 2026.09.12–14 · 資料層
   conf 定位可信度： ok=有完整韓文地址 / search=只有店名，用 Naver 搜
                    check=營業時間或地址未證實，出發前/當天要確認
   ========================================================= */

const HOTEL = {
  name:"東橫INN 釜山西面店", kr:"토요코인 부산 서면",
  addr:"부산광역시 부산진구 서전로 39", conf:"ok",
  meta:"西面站 8 號出口走 6 分 · 24H 櫃檯", tel:"+82-51-638-1045"
};

/* ---- 地點資料庫 ---- */
const P = {
  hotel:{n:"東橫INN 釜山西面店",kr:"토요코인 부산 서면",addr:"부산광역시 부산진구 서전로 39",nid:"20083341",conf:"ok",area:"西面",type:"hotel"},

  /* 西面 / 田浦 */
  bujebi:{n:"부제비（海鮮麵疙瘩＋刀削麵）",kr:"부제비",addr:"부산 부산진구 서전로38번길 43-3 1층",nid:"2044464456",book:"Tabling 候位",bookUrl:"https://www.tabling.co.kr/restaurant/13093",conf:"ok",area:"西面",type:"food",tag:"刀削麵",
    hours:"11:00–21:00（15:00–17:00 休息）",price:"約 ₩10,000–13,000",
    must:["해물수제비 海鮮麵疙瘩","칼국수 刀削麵","굴제비（季節有牡蠣時）"],

function naverURL(p){
  if(p.nid) return "https://map.naver.com/p/entry/place/"+p.nid;   // 直連該店，不靠搜尋碰運氣
  const q=[p.kr||p.n, p.addr&&p.addr!==p.kr?p.addr:""].filter(Boolean).join(" ");
  return "https://map.naver.com/p/search/"+encodeURIComponent(q);
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove("on"),1500)}
function copy(txt,label){
  const done=()=>toast("已複製："+(label||txt));
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done).catch(fallback)}
  else fallback();
  function fallback(){
    const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){toast("複製失敗，長按選取")}
    document.body.removeChild(ta);
  }
}
function igOf(p){
  const k=Object.keys(P).find(x=>P[x]===p); if(!k) return null;
  const hit=(typeof IG!=="undefined") ? IG.find(x=>(x.p||[]).includes(k)) : null;
  return hit ? {url:hit.u, title:hit.t} : null;
}

        <button class="btn" data-copy="${esc(pl.kr)}" data-label="${esc(pl.kr)}">📋 韓文店名</button>
      </div></div>`;
  });
  if(!places.length) h+=`<div class="tip" style="margin-top:12px">💡 這則沒有對應到單一店家（是清單型貼文），店名寫在上面說明裡，用 Naver 搜。</div>`;
  h+=`<div class="acts" style="margin-top:14px">
        <a class="btn" href="${x.u}" target="_blank" rel="noopener">📸 開 IG 看原片</a>
        ${x.day?`<button class="btn pri" data-goday="${x.day}">📅 跳到 ${x.day} 行程</button>`:""}
      </div></div>`;
  $("#sheetPanel").innerHTML=h;
  $("#sheet").classList.add("on");
  document.body.style.overflow="hidden";
}
function closeSheet(){$("#sheet").classList.remove("on");document.body.style.overflow=""}

/* ---------- 慶祝：倒數 / 主秀 / 彩帶 ---------- */
const TRIP_START=new Date(2026,8,12), TRIP_END=new Date(2026,8,14,23,59);
function renderCount(){
  const n=new Date(), el=$("#dcount"); if(!el) return;
  const d0=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  const diff=Math.round((TRIP_START-d0)/864e5);
  if(diff>0) el.textContent=`還有 ${diff} 天`;
  else if(n<=TRIP_END) el.textContent=`Day ${diff===0?1:1-diff} / 3 🎂`;
  else el.textContent="旅程結束";
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const cv=$("#confetti"),ctx=cv.getContext("2d");
  cv.width=innerWidth;cv.height=innerHeight;cv.style.display="block";
  const CS=["#E8B84B","#0A5A78","#D9695A","#3FA57C","#E7D7B0"];
  const ps=Array.from({length:110},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,
    w:5+Math.random()*6,h:8+Math.random()*8,vy:2.2+Math.random()*3.2,vx:-1.2+Math.random()*2.4,
    a:Math.random()*6.28,va:-.16+Math.random()*.32,c:CS[(Math.random()*CS.length)|0]}));
  let t0=performance.now();
  (function loop(t){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
    if(t-t0<2600) requestAnimationFrame(loop);
    else {ctx.clearRect(0,0,cv.width,cv.height);cv.style.display="none"}
  })(t0);
}

/* ---------- now marker ---------- */
function markNow(){
  const now=new Date(), d=DAYS[curDay];
  const today=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
  if(today!==d.date) return;
  const mins=now.getHours()*60+now.getMinutes();
  let best=null;
  d.items.forEach((it,i)=>{
    if(!it.t) return;
    const [H,M]=it.t.split(":").map(Number);
    if(H*60+M<=mins) best=`${d.id}_${i}`;
  });
  if(best){const el=document.querySelector(`[data-ev="${best}"]`);if(el){el.classList.add("now");
    const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;setTimeout(()=>el.scrollIntoView({behavior:rm?"auto":"smooth",block:"center"}),260);}}
}

/* ---------- nav ---------- */
const TABS=[["plan","📅","行程"],["ig","📸","IG"],["food","🍜","吃"],["shop","🛍","買"],["map","🗺","地圖"],["ko","한","韓文"]];
let cur="plan";
function renderNav(){
  $("#nav").innerHTML=TABS.map(([k,i,l])=>`<button class="nb ${k===cur?"on":""}" data-tab="${k}"><span class="i">${i}</span><span class="l">${l}</span></button>`).join("");
}
function go(tab){
  cur=tab; renderNav();
  if(tab==="plan"){ renderDaybar(); planMode==="prep"?renderPrep():renderPlan(); }
  TABS.forEach(([k])=>$("#v-"+k).classList.toggle("hide",k!==tab));
  $("#daybar").classList.toggle("hide",tab!=="plan");
  const sub=$("#hsub");
  sub.textContent = tab==="plan" ? "LJ752 09.12 → LJ751 09.14 · 釜山" :
    ({ig:"16 則 IG · 用畫面認店",food:"必吃四格 · IG 認證店",shop:"大創 · CRR · 米菲兔 · 選物",map:"全部地點 · 一鍵 NAVER",ko:"點卡片複製 · 點 🔊 發音"})[tab];
  $("#dcount").classList.toggle("hide",tab!=="plan");
  window.scrollTo({top:0,behavior:"instant"});
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target;

  const tab=t.closest("[data-tab]");        if(tab){go(tab.dataset.tab);return}
  if(t.closest("[data-close]")){closeSheet();return}
  const igf=t.closest("[data-igf]");        if(igf){igFilter=igf.dataset.igf;renderIG();window.scrollTo({top:0,behavior:"instant"});return}
  const igc=t.closest("[data-ig]");         if(igc){openSheet(igc.dataset.ig);return}
  const gd=t.closest("[data-goday]");
  if(gd){const i=DAYS.findIndex(d=>d.label.startsWith(gd.dataset.goday));
    closeSheet(); if(i>=0){planMode="day";curDay=i;} go("plan"); return}
  const day=t.closest("[data-day]");
  if(day){
    if(day.dataset.day==="prep"){ planMode="prep"; renderDaybar(); renderPrep(); }
    else { planMode="day"; curDay=+day.dataset.day; renderDaybar(); renderPlan(); }
    window.scrollTo({top:0,behavior:"instant"}); return;
  }
  const say=t.closest("[data-say]");
  if(say){ e.stopPropagation();
    try{const u=new SpeechSynthesisUtterance(say.dataset.say);u.lang="ko-KR";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u);}
    catch(err){toast("這台裝置沒有韓文語音")} return;
  }
  const cp=t.closest("[data-copy]");        if(cp){copy(cp.dataset.copy,cp.dataset.label);return}
  const tg=t.closest("[data-toggle]");      if(tg){tg.closest("[data-card]").classList.toggle("open");return}
  const ck=t.closest("[data-chk]");
  if(ck){const k=ck.dataset.chk; checks[k]=!checks[k]; LS.set("checks",checks);
    ck.classList.toggle("on",!!checks[k]); ck.closest("[data-card]").classList.toggle("done",!!checks[k]); return}
  const ms=t.closest("[data-must]");
  if(ms){const k=ms.dataset.must; musts[k]=!musts[k]; LS.set("musts",musts); ms.classList.toggle("on",!!musts[k]);
    if(musts[k]&&MUSTS.every(m=>musts[m.id])){toast("🎉 必吃四格全滿！");confetti()}
    const tr=$("#trophy"); if(tr) tr.classList.toggle("hide",!MUSTS.every(m=>musts[m.id])); return}
  if(t.closest("a")) return;
  const pp=t.closest("[data-prep]");
  if(pp){const k=pp.dataset.prep; prep[k]=!prep[k]; LS.set("prep",prep);
    pp.classList.toggle("on",!!prep[k]); pp.querySelector(".chk").classList.toggle("on",!!prep[k]); return}
  const wt=t.closest("[data-want]");
  if(wt){const k=wt.dataset.want; wants[k]=!wants[k]; LS.set("wants",wants);
    wt.classList.toggle("on",!!wants[k]); wt.querySelector(".chk").classList.toggle("on",!!wants[k]); return}
});

/* ---------- boot ---------- */
(function(){
  const now=new Date();
  const today=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
  const i=DAYS.findIndex(d=>d.date===today); if(i>=0) curDay=i;

  $("#foot").innerHTML=`資料整理自你給的 16 則 IG 貼文（13 則抓到內容）＋ 現查的官方／地圖資訊。<br>
    日落時間為天文計算值：9/12 18:37 · 9/13 18:35 · 9/14 18:34。<br>
    營業時間與公休隨時會變 — 出發前跑一次「出發前」分頁的待辦。<br><br>🎂 生日快樂`;
})();
